name: Code and route checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost/app_db?host=/tmp/mm-audit-pg
      AUDIT_DATABASE_URL: postgresql://postgres:postgres@localhost/app_db?host=/tmp/mm-audit-pg
      SESSION_SECRET: isolated-ci-session-secret-not-for-production-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run test:wallet && npm run test:live && npm run test:suggestions && npm run test:admin && npm run test:auth
      - name: Check generated database bundle
        run: npm run db:bundle && git diff --exit-code -- scripts/supabase/01-upgrade.sql scripts/supabase/03-schema-audit.sql
      - run: npm run build
      - name: Install optional local audit transport and browser
        run: npm install --prefix "$RUNNER_TEMP/mm-audit-tools" @electric-sql/pglite-socket@0.2.20 playwright-core@1.65.1 @sparticuz/chromium@153.0.0
      - name: Exercise production HTTP routes and browser filters against an isolated database
        env:
          AWS_EXECUTION_ENV: AWS_Lambda_nodejs22.x
        run: |
          export AUDIT_DB_DEPS="$RUNNER_TEMP/mm-audit-tools"
          export UI_TEST_DEPS="$RUNNER_TEMP/mm-audit-tools"
          node tests/integration/serve-audit-db.mjs > "$RUNNER_TEMP/audit-db.log" 2>&1 &
          DB_PID=$!
          npm start -- --hostname 0.0.0.0 --port 3000 > "$RUNNER_TEMP/audit-web.log" 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" "$DB_PID" 2>/dev/null || true' EXIT
          node tests/integration/wait-for-audit.mjs
          npm run test:routes
          npm run test:browser
          npm run test:suggestions:browser
          npm run test:admin:browser
          npm run test:auth:browser
          npm run test:mobile:browser
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: isolated-audit-logs
          path: |
            ${{ runner.temp }}/audit-db.log
            ${{ runner.temp }}/audit-web.log
          retention-days: 3

name: Code and route checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost/app_db?host=/tmp/mm-audit-pg
      AUDIT_DATABASE_URL: postgresql://postgres:postgres@localhost/app_db?host=/tmp/mm-audit-pg
      SESSION_SECRET: isolated-ci-session-secret-not-for-production-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck && npm run lint && npm test
      - name: Wallet and migration manifest
        shell: bash
        run: npm run test:wallet 2>&1 | tee "$RUNNER_TEMP/audit-wallet.log"
      - name: Realtime and storage
        shell: bash
        run: npm run test:live 2>&1 | tee "$RUNNER_TEMP/audit-live.log"
      - name: Movie suggestions
        shell: bash
        run: npm run test:suggestions 2>&1 | tee "$RUNNER_TEMP/audit-suggestions.log"
      - name: Admin permissions
        shell: bash
        run: npm run test:admin 2>&1 | tee "$RUNNER_TEMP/audit-admin.log"
      - name: Auth and sessions
        shell: bash
        run: npm run test:auth 2>&1 | tee "$RUNNER_TEMP/audit-auth.log"
      - name: Check generated database bundle
        run: npm run db:bundle && git diff --exit-code -- scripts/supabase/01-upgrade.sql scripts/supabase/03-schema-audit.sql
      - run: npm run build
      - name: Install optional local audit transport and browser
        run: npm install --prefix "$RUNNER_TEMP/mm-audit-tools" @electric-sql/pglite-socket@0.2.20 playwright-core@1.65.1 @sparticuz/chromium@153.0.0
      - name: Exercise production HTTP routes and browser filters against an isolated database
        shell: bash
        env:
          AWS_EXECUTION_ENV: AWS_Lambda_nodejs22.x
        run: |
          set -euo pipefail
          run_suite() {
            echo "::group::$1"
            if ! npm run "$1" 2>&1 | tee "$RUNNER_TEMP/audit-${1//:/-}.log"; then
              echo "::endgroup::"
              echo "::error title=Isolated browser/HTTP suite failed::$1 failed; see isolated-audit-logs for details."
              exit 1
            fi
            echo "::endgroup::"
          }
          export AUDIT_DB_DEPS="$RUNNER_TEMP/mm-audit-tools"
          export UI_TEST_DEPS="$RUNNER_TEMP/mm-audit-tools"
          node tests/integration/serve-audit-db.mjs > "$RUNNER_TEMP/audit-db.log" 2>&1 &
          DB_PID=$!
          npm start -- --hostname 0.0.0.0 --port 3000 > "$RUNNER_TEMP/audit-web.log" 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" "$DB_PID" 2>/dev/null || true' EXIT
          node tests/integration/wait-for-audit.mjs
          run_suite test:routes
          run_suite test:trailers:compat
          run_suite test:browser
          run_suite test:suggestions:browser
          run_suite test:admin:browser
          run_suite test:auth:browser
          run_suite test:mobile:browser
          run_suite test:ambient:browser
          run_suite test:hud:browser
          run_suite test:passport:browser
          run_suite test:orbit:browser
          run_suite test:rankings:browser
          run_suite test:showcase:browser
          run_suite test:pulse:browser
          run_suite test:settings:browser
          run_suite test:account:browser
          run_suite test:shell:browser
          run_suite test:experience:browser
          run_suite test:pages:browser
          run_suite test:personal:browser
          run_suite test:community-cinema:browser
          run_suite test:conversations:browser
          run_suite test:together:browser
          run_suite test:play:browser
          run_suite test:journeys:browser
          run_suite test:pet:browser
          run_suite test:year:browser
          run_suite test:identity:browser
          run_suite test:frame:browser
          run_suite test:series:browser
          run_suite test:detail:browser
          run_suite test:brand:browser
          run_suite test:catalog:browser
          run_suite test:design:browser
          run_suite test:profiles:browser
          run_suite test:city-series:browser
          run_suite test:location:browser
          run_suite test:cine-day:browser
          run_suite test:community:browser
          run_suite test:roulette:browser
          run_suite test:playback:browser
          run_suite test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: isolated-audit-logs
          path: |
            ${{ runner.temp }}/audit-*.log
          retention-days: 3
